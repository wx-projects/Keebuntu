name: Build and Release Status Notifier

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-status-notifier.yml'
      - 'VERSION'
      - 'KeePassExe.proj'
      - 'DBus/**'
      - 'StatusNotifierPlugin/**'
      - 'build-status-notifier.sh'
      - 'packaging/**'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keebuntu-status-notifier-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            mono-devel \
            keepass2 \
            libdbus2.0-cil-dev \
            libdbus-glib2.0-cil-dev \
            libgtk2.0-cil-dev \
            libdbus-glib-1-2 \
            dpkg-dev

      - name: Build release packages
        run: |
          chmod +x \
            build-status-notifier.sh \
            packaging/install.sh \
            packaging/debian/build-deb.sh \
            packaging/arch/build-aur-source.sh \
            packaging/arch/build-package.sh
          ./build-status-notifier.sh
          ./packaging/debian/build-deb.sh
          ./packaging/arch/build-aur-source.sh
          ./packaging/arch/build-package.sh
          (cd dist && sha256sum \
            keebuntu-status-notifier-*.tar.gz \
            keepass2-plugin-status-notifier_*_all.deb \
            keepass-plugin-keebuntu-status-notifier-*.pkg.tar.zst \
            keepass-plugin-keebuntu-status-notifier-aur-*.tar.gz \
            > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Keebuntu Status Notifier $VERSION" \
              --notes "Maintained Linux StatusNotifierItem plugin for KeePass 2.x. Includes a generic archive, Debian package, installable Arch Linux package, AUR source package and SHA-256 checksums." \
              dist/*
          fi
